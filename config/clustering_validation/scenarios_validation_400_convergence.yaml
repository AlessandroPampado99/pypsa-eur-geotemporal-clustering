# ---------------------------------------------------------------------------
# Budget geo-temporal scan with free convergence:
# each run starts from a different initial (nodes, days) pair, but the reducer
# is free to rebalance under max_total_steps.
#
# Target:
#   max_total_steps = 400
#
# Important:
#   These are NOT fixed-pair runs.
#   init_nodes/init_days define only the starting point.
# ---------------------------------------------------------------------------

gtb-init-n2-d200:
  clustering:
    geotemporal:
      reducer:
        reduction_mode: "budget"
        init_mode: "balanced"
        init_nodes: 2
        init_days: 200
        max_total_steps: 400
        lambda_ts: 0.15
        beta: 0.05
        beta_growth: 1.3
        beta_max: 1.0
        max_iter: 50
        tol_no_change: 7
        objective_tol_rel: 1.0e-5
        norm_q: 0.95
        kmedoids_max_iter: 100

