paths:
  root_dir: "/home/pampado/clustering/pypsa-eur"
  runs_dir: "results/reference_nuts3_IT_kmeans_900"
  output_dir: "results/reference_nuts3/analysis/geotemporal_comparison_IT_kmeans_900"

network:
  # Flexible template. Available placeholders:
  # {root_dir}, {runs_dir}, {run}, {filename}
  filename: "base_s_adm_elec_Gt.nc"
  path_template: "{root_dir}/{runs_dir}/{run}/networks/{filename}"

reference:
  run: "complete"
  n_nodes: 96
  n_days: 365

runs:
  auto_discover: false
  include:
    - complete
    - gtf-n2-d365
    - gtf-n4-d200
    - gtf-n6-d140
    - gtf-n8-d100
    - gtf-n10-d80
    - gtf-n13-d66
    - gtf-n16-d50
    - gtf-n20-d40
    - gtf-n25-d36
    - gtf-n30-d30
    - gtf-n36-d24
    - gtf-n44-d18
    - gtf-n50-d17
    - gtf-n54-d16
    - gtf-n68-d13
    - gtf-n77-d11
    - gtf-n81-d11
    - gtf-n90-d11
    - gtf-n94-d9
    - gtf-n96-d8
  exclude: []

budget_scan:
  enabled: true
  min_total_steps: 700
  max_total_steps: 900

clustering:
  enabled: true

  # Expected clustering history path:
  # resources/reference_nuts3_mean_900_nolineexpansion/<run>/geotemporal_clustering/base_s_adm_elec_Gt/history.csv
  resources_dir: "resources/reference_nuts3_IT_kmeans_900"

  history_filename: "history.csv"
  objective_column: "objective"

  # Available placeholders:
  # {root_dir}, {resources_dir}, {run}, {history_filename}
  history_path_template: "{root_dir}/{resources_dir}/{run}/geotemporal_clustering/base_s_adm_elec_Gt/{history_filename}"

carriers:
  conventional:
    - nuclear
    - oil
    - OCGT
    - CCGT
    - coal
    - lignite
    - geothermal
    - biomass

  renewable:
    - solar
    - solar-hsat
    - onwind
    - offwind-ac
    - offwind-dc
    - offwind-float
    - hydro

metrics:
  objective: true
  demand: true
  generation: true
  capacities: true

weights:
  # For reconstructed full-year networks, "objective" is often safer if it
  # contains the correct temporal weights after representative-day expansion.
  energy_weight_column: "objective"

capacity:
  components:
    Generator:
      enabled: true
      attribute: "p_nom_opt"
      fallback_attribute: "p_nom"

    Link:
      enabled: true
      attribute: "p_nom_opt"
      fallback_attribute: "p_nom"

    Store:
      enabled: true
      attribute: "e_nom_opt"
      fallback_attribute: "e_nom"

    StorageUnit:
      enabled: true
      attribute: "p_nom_opt"
      fallback_attribute: "p_nom"

    Line:
      enabled: true
      attribute: "s_nom_opt"
      fallback_attribute: "s_nom"

objective_correction:
  enabled: true

  # Components whose capex + opex should be removed from the optimization objective.
  # Default is only Line. Add Transformer if needed.
  # Be careful with Link: in PyPSA-Eur it also includes converters, electrolysers, etc.
  exclude_components:
    - Line

plots:
  enabled: true
  dpi: 300
  formats:
    - png
    - pdf

  make_2d: true

  # Matplotlib 3D is visually misleading for this budget-scan geometry.
  make_3d: false

  # Additional plots.
  make_budget_combined: true
  make_objective_comparison: true
  make_objective_without_line_cost_comparison: true

  # Possible values: absolute, delta, relative_delta
  plot_values:
    - absolute
    - relative_delta

  # Metrics available in metrics_summary.csv.
  metrics:
    - objective
    - objective_without_line_cost
    - renewable_generation
    - conventional_generation
    - total_demand
    - renewable_capacity
    - conventional_capacity
    - store_energy_capacity
    - storage_unit_power_capacity
    - link_power_capacity
    - line_capacity

  # Combined percentage plot along budget_scan.
  # All these are plotted as *_relative_delta [%].
  budget_combined_profiles:
    - metric: conventional_generation
      label: "Conventional generation"

    - metric: renewable_capacity
      label: "Renewable capacity"

    - metric: store_energy_capacity
      label: "Store capacity"

    - metric: objective
      label: "Objective function"

    - metric: renewable_generation
      label: "Renewable generation"

    - metric: link_power_capacity
      label: "Link capacity"

  capacity_heatmaps:
    enabled: true
    value: "relative_delta"

    components:
      - Generator
      - Link
      - Store
      - StorageUnit
      - Line

    # Empty list means "plot all carriers found".
    # Otherwise only selected carriers are plotted.
    generator_carriers:
      - solar
      - solar-hsat
      - onwind
      - offwind-ac
      - offwind-dc
      - offwind-float
      - hydro
      - nuclear
      - OCGT
      - CCGT
      - biomass