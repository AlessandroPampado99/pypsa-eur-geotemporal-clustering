# ---------------------------------------------------------------------------
# Fixed-pair geo-temporal scan - Germany:
# 380 <= fixed_nodes * fixed_days <= 420
# Germany has up to 245 PyPSA-Eur regions in this setup.
# Prefer pairs close to 400 where integer constraints allow it.
# Around 20 combinations covering temporal-heavy, balanced, and spatial-heavy cases.
#
# Note:
# With this budget, n245 cannot be included:
#   245 * 1 = 245  below budget
#   245 * 2 = 490  above budget
# The most spatially detailed feasible cases are therefore around n190-n210 with d2.
# ---------------------------------------------------------------------------

gtf-n2-d200:
  clustering:
    geotemporal:
      reducer:
        reduction_mode: "fixed_pair"
        fixed_nodes: 2
        fixed_days: 200
        max_total_steps: 400

