# ---------------------------------------------------------------------------
# Fixed-pair geo-temporal scan - Spain:
# Target budget: fixed_nodes * fixed_days ≈ 400
# Spain has up to 47 PyPSA-Eur regions in this setup.
#
# Most pairs satisfy:
#   380 <= fixed_nodes * fixed_days <= 420
#
# Note:
# The full-spatial case n47 cannot exactly satisfy the budget window:
#   47 * 8 = 376  slightly below budget
#   47 * 9 = 423  slightly above budget
# We include n47-d8 as the full-spatial corner case.
# ---------------------------------------------------------------------------

