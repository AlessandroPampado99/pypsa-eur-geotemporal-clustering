# ---------------------------------------------------------------------------
# Fixed-pair geo-temporal scan - Germany:
# Target budget: approximately 900 geo-temporal nodes.
# Germany is limited to at most 210 spatial nodes in this setup.
#
# Around 20 combinations are included, covering temporal-heavy, balanced,
# and spatial-heavy configurations.
#
# Notes:
# - n2 cannot reach the target budget because the temporal resolution is
#   limited to 365 days:
#       2 * 365 = 730
# - The most temporal-heavy configuration close to the target is therefore
#   n3-d300.
# - At the spatial-heavy extreme, n210-d4 gives 840 geo-temporal nodes.
#   Using five days would instead give 1050, farther from the target.
# ---------------------------------------------------------------------------

gtf-n3-d300:
  clustering:
    geotemporal:
      reducer:
        reduction_mode: "fixed_pair"
        fixed_nodes: 3
        fixed_days: 300
        max_total_steps: 900

