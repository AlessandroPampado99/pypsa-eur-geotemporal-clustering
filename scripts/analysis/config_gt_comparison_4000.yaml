paths:
  root_dir: "/home/pampado/clustering/pypsa-eur"
  runs_dir: "results/reference_nuts3_mean_4000"
  output_dir: "results/reference_nuts3/analysis/geotemporal_comparison_4000_mean"

network:
  # Flexible template. Available placeholders:
  # {root_dir}, {runs_dir}, {run}, {filename}
  filename: "base_s_adm_elec_Gt.nc"
  path_template: "{root_dir}/{runs_dir}/{run}/networks/{filename}"

reference:
  run: "complete"
  n_nodes: 96
  n_days: 365

runs:
  auto_discover: true
  include: []
  exclude: []

budget_scan:
  enabled: true
  min_total_steps: 3800
  max_total_steps: 4200

carriers:
  conventional:
    - nuclear
    - oil
    - OCGT
    - CCGT
    - coal
    - lignite
    - geothermal
    - biomass

  renewable:
    - solar
    - solar-hsat
    - onwind
    - offwind-ac
    - offwind-dc
    - offwind-float
    - hydro

metrics:
  objective: true
  demand: true
  generation: true
  capacities: true

weights:
  # Usually "generators" is the right choice for energy quantities.
  # Alternatives in PyPSA can be "objective" or "stores", depending on the workflow.
  energy_weight_column: "objective"

capacity:
  components:
    Generator:
      enabled: true
      attribute: "p_nom_opt"
      fallback_attribute: "p_nom"
    Link:
      enabled: true
      attribute: "p_nom_opt"
      fallback_attribute: "p_nom"
    Store:
      enabled: true
      attribute: "e_nom_opt"
      fallback_attribute: "e_nom"
    StorageUnit:
      enabled: true
      attribute: "p_nom_opt"
      fallback_attribute: "p_nom"
    Line:
      enabled: true
      attribute: "s_nom_opt"
      fallback_attribute: "s_nom"

plots:
  enabled: true
  dpi: 300
  formats:
    - png
    - pdf

  make_2d: true
  make_3d: true

  # Possible values: absolute, delta, relative_delta
  plot_values:
    - absolute
    - relative_delta

  # Metrics available in metrics_summary.csv
  metrics:
    - objective
    - renewable_generation
    - conventional_generation
    - total_demand
    - renewable_capacity
    - conventional_capacity
    - store_energy_capacity
    - storage_unit_power_capacity
    - link_power_capacity
    - line_capacity

  capacity_heatmaps:
    enabled: true
    value: "relative_delta"
    components:
      - Generator
      - Link
      - Store
      - StorageUnit
      - Line

    # Empty list means "plot all carriers found".
    # Otherwise only selected carriers are plotted.
    generator_carriers:
      - solar
      - solar-hsat
      - onwind
      - offwind-ac
      - offwind-dc
      - offwind-float
      - hydro
      - nuclear
      - OCGT
      - CCGT
      - biomass